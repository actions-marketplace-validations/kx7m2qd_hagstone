name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Re-verified against pinned SHA-256 on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hagstone/engines
          key: hagstone-engines-${{ runner.os }}-${{ hashFiles('src/engines/manifest.ts') }}
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run dev -- engines install
      - run: npm run check
      - run: npm run bench
      - run: npm run build

  # OWASP Benchmark score gates (bench/owasp-thresholds*.json). The suites are GPL, so they are
  # downloaded at a pinned commit and verified by SHA-256 (bench/owasp.ts), never vendored.
  owasp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [python, java]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/hagstone/engines
            ~/.cache/hagstone/bench
          key: hagstone-owasp-${{ matrix.lang }}-${{ runner.os }}-${{ hashFiles('src/engines/manifest.ts', 'bench/owasp.ts') }}
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run dev -- engines install
      - run: npx tsx bench/owasp.ts ${{ matrix.lang }}
