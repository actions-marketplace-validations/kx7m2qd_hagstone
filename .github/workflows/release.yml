name: Release

# Publishes hagstone to npm with provenance when a version tag (v1.2.3) is pushed.
# Auth: npm trusted publishing (OIDC). On npmjs.com, package hagstone → Settings → Trusted publisher:
# GitHub Actions, repo kx7m2qd/hagstone, workflow release.yml. No NPM_TOKEN secret needed.
# A version that is already on npm (e.g. published by hand) is skipped, not re-published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
          grep -q "TOOL_VERSION = \"$v\"" src/version.ts || { echo "src/version.ts is not $v"; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hagstone/engines
          key: hagstone-engines-${{ runner.os }}-${{ hashFiles('src/engines/manifest.ts') }}
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run dev -- engines install
      - run: npm run check
      - run: npm run bench
      - name: Skip if this version is already on npm
        id: published
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "hagstone@$v" version >/dev/null 2>&1; then
            echo "hagstone@$v is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - if: steps.published.outputs.skip != 'true'
        run: npm install -g npm@11.6.2 --no-audit --no-fund
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
