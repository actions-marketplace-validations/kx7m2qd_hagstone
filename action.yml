name: Hagstone security scan
description: Local-first security scan for code, dependencies and secrets. PR comments, code scanning, and no code leaves the runner.
author: kx7m2qd
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    default: "."
  fail-on:
    description: Fail the check if a finding is at least this severe (critical, high, medium, low, info, none).
    default: high
  trust-reachability:
    description: Let fail-on use the lowered severity of dependencies nothing uses, or only tests and dev tooling use.
    default: "false"
  reachable-only:
    description: Leave unreachable dependency findings out of the report entirely.
    default: "false"
  include-tests:
    description: Also report code and dependency findings in test and example code (hidden by default).
    default: "false"
  offline:
    description: Skip the registry lookups in the supply-chain checks (npm/PyPI package names only).
    default: "false"
  engines:
    description: Comma-separated subset of engines to run (default all).
    default: ""
  upload-sarif:
    description: "Upload results to GitHub code scanning. Needs `security-events: write`."
    default: "true"
  sarif-file:
    description: Where to write the SARIF report.
    default: hagstone.sarif
  check-run:
    description: "Post a \"Hagstone\" check run with annotations. Needs `checks: write`."
    default: "true"
  pr-comments:
    description: >-
      On pull requests, comment on the added lines that have findings. Needs `pull-requests: write`.
      `auto` (default) comments only when upload-sarif is off: with it on, GitHub code scanning
      already comments on those lines.
    default: auto
  comment-min-severity:
    description: Weakest severity that gets a PR comment (weaker findings appear in the check run only).
    default: medium
  github-token:
    description: Token for the check run and PR comments.
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "0 clean, 1 findings at or above fail-on, 2 engine or usage error."
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Build Hagstone
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --no-audit --no-fund --ignore-scripts
        npm run build
        echo "HAGSTONE_HOME=$RUNNER_TEMP/hagstone-home" >> "$GITHUB_ENV"
        echo "engines-key=hagstone-engines-$RUNNER_OS-$RUNNER_ARCH-$(sha256sum src/engines/manifest.ts | cut -c1-16)" >> "$GITHUB_OUTPUT"
      id: build

    # Engine binaries are re-verified against their pinned SHA-256 on every run, so a tampered
    # cache is replaced, never executed.
    - name: Cache engines
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/hagstone-home
        key: ${{ steps.build.outputs.engines-key }}

    - name: Scan
      id: scan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        IN_PATH: ${{ inputs.path }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_TRUST: ${{ inputs.trust-reachability }}
        IN_REACHABLE_ONLY: ${{ inputs.reachable-only }}
        IN_INCLUDE_TESTS: ${{ inputs.include-tests }}
        IN_OFFLINE: ${{ inputs.offline }}
        IN_ENGINES: ${{ inputs.engines }}
        IN_SARIF: ${{ inputs.sarif-file }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        args=(scan "$IN_PATH" --format sarif --output "$IN_SARIF" --fail-on "$IN_FAIL_ON")

        # On pull requests, ignore patterns come from the base branch: the PR's own .hagstoneignore
        # could otherwise exclude the code it adds. If the base copy can't be read, use none.
        if [ -n "$BASE_SHA" ]; then
          ignore_file="$RUNNER_TEMP/hagstone-base.hagstoneignore"
          : > "$ignore_file"
          prefix=$(git -C "$IN_PATH" rev-parse --show-prefix 2>/dev/null || true)
          if git -C "$IN_PATH" cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
             || git -C "$IN_PATH" fetch --quiet --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            git -C "$IN_PATH" show "$BASE_SHA:${prefix}.hagstoneignore" > "$ignore_file" 2>/dev/null \
              || git -C "$IN_PATH" show "$BASE_SHA:${prefix}.vigilignore" > "$ignore_file" 2>/dev/null \
              || : > "$ignore_file"
          else
            echo "::warning::Hagstone couldn't fetch the base commit, so it is scanning without any .hagstoneignore patterns."
          fi
          head_ignore="$IN_PATH/.hagstoneignore"
          [ -f "$head_ignore" ] || head_ignore="$IN_PATH/.vigilignore"
          if ! cmp -s "$ignore_file" "$head_ignore" && { [ -s "$ignore_file" ] || [ -s "$head_ignore" ]; }; then
            echo "::warning file=${prefix}.hagstoneignore::This pull request changes .hagstoneignore. Hagstone used the base branch's version; the change takes effect after merge."
          fi
          args+=(--ignore-file "$ignore_file")

          # Same for the baseline: a PR must not be able to hide the findings it adds.
          base_baseline="$RUNNER_TEMP/hagstone-base-baseline.json"
          if git -C "$IN_PATH" show "$BASE_SHA:${prefix}.hagstone/baseline.json" > "$base_baseline" 2>/dev/null; then
            args+=(--baseline "$base_baseline")
          else
            : > "$base_baseline"
            args+=(--no-baseline)
          fi
          head_baseline="$IN_PATH/.hagstone/baseline.json"
          if [ -f "$head_baseline" ] || [ -s "$base_baseline" ]; then
            if ! cmp -s "$base_baseline" "$head_baseline" 2>/dev/null; then
              echo "::warning file=${prefix}.hagstone/baseline.json::This pull request changes the Hagstone baseline. The check used the base branch's version; the change takes effect after merge."
            fi
          fi
        fi

        [ "$IN_TRUST" = "true" ] && args+=(--trust-reachability)
        [ "$IN_REACHABLE_ONLY" = "true" ] && args+=(--reachable-only)
        [ "$IN_INCLUDE_TESTS" = "true" ] && args+=(--include-tests)
        [ "$IN_OFFLINE" = "true" ] && args+=(--offline)
        [ -n "$IN_ENGINES" ] && args+=(--engines "$IN_ENGINES")
        set +e
        node "$ACTION_PATH/dist/cli.js" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$IN_SARIF" >> "$GITHUB_OUTPUT"
        echo "prefix=$(git -C "$IN_PATH" rev-parse --show-prefix 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
        [ -f "$IN_SARIF" ] && node "$ACTION_PATH/scripts/action-summary.mjs" "$IN_SARIF" "$code" >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-file) != '' }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: hagstone

    # Check run + inline PR comments. Sends Finding data only; never fails the job (the Gate does).
    - name: Report to pull request
      if: ${{ always() && (inputs.check-run == 'true' || inputs.pr-comments == 'true' || (inputs.pr-comments == 'auto' && inputs.upload-sarif != 'true')) && hashFiles(inputs.sarif-file) != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HAGSTONE_GITHUB_TOKEN: ${{ inputs.github-token }}
        IN_SARIF: ${{ inputs.sarif-file }}
        CODE: ${{ steps.scan.outputs.exit-code }}
        PREFIX: ${{ steps.scan.outputs.prefix }}
        IN_CHECK_RUN: ${{ inputs.check-run }}
        IN_PR_COMMENTS: ${{ inputs.pr-comments }}
        IN_UPLOAD: ${{ inputs.upload-sarif }}
        IN_MIN: ${{ inputs.comment-min-severity }}
      run: |
        if [ "$IN_PR_COMMENTS" = "auto" ]; then
          [ "$IN_UPLOAD" = "true" ] && IN_PR_COMMENTS=false || IN_PR_COMMENTS=true
        fi
        node "$ACTION_PATH/dist/cli.js" action-report --sarif "$IN_SARIF" --exit-code "${CODE:-2}" --prefix "$PREFIX" \
          --check-run "$IN_CHECK_RUN" --pr-comments "$IN_PR_COMMENTS" --min-severity "$IN_MIN" \
          || echo "::warning::Hagstone could not report to the pull request."

    - name: Gate
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        case "$CODE" in
          0) echo "Hagstone: no findings at or above the fail-on level." ;;
          1) echo "::error::Hagstone found issues at or above the fail-on level. See the Security tab or the job summary."; exit 1 ;;
          *) echo "::error::Hagstone could not complete the scan (exit $CODE). See the Scan step log."; exit 2 ;;
        esac
